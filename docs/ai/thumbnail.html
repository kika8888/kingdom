<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>KINGDOM 블로그 썸네일 만들기</title>
<meta name="description" content="제목만 넣으면 블로그·스레드·쇼츠 썸네일을 바로 만들어 저장해요. 로그인 필요 없음.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Black+Han+Sans&display=swap">
<style>
/* KINGDOM 남색 (노란색 없음) — /ai 페이지 머리줄 + 왼쪽 입력 | 오른쪽 미리보기 */
:root{--bg:#eef0f8;--card:#fff;--ink:#17182b;--muted:#5d6072;--line:#d9dcec;--navy:#1c1f4a;--navy2:#2e3478;--chip:#eceef8;--warn:#c0263d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
a{color:inherit}
header{background:linear-gradient(135deg,var(--navy),var(--navy2))}
.bar{max-width:1140px;margin:0 auto;padding:16px;display:flex;align-items:center;gap:44px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;color:#fff;font-weight:900;font-size:1.45rem;letter-spacing:.12em}
nav{display:flex;gap:30px;font-size:1.08rem;font-weight:500}
nav a{text-decoration:none;color:#c9cbe0;padding:4px 0;border-bottom:2px solid transparent}nav a:hover{color:#fff}
nav a[aria-current]{color:#fff;font-weight:700;border-bottom-color:#fff}
@media (max-width:580px){nav{gap:18px;font-size:1rem}.bar{gap:18px}}
main{max-width:1140px;margin:0 auto;padding:28px 16px 60px;display:flex;flex-direction:column;gap:20px}
.title h1{margin:0;font-size:1.7rem;font-weight:900;color:var(--navy);letter-spacing:-.02em}
.title p{margin:4px 0 0;color:var(--muted)}
.free{display:inline-block;font-size:.8rem;font-weight:700;background:#dff4ec;color:#0f7a5a;border-radius:999px;padding:2px 10px;margin-left:6px;vertical-align:middle}
.step{display:grid;grid-template-columns:340px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.step{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px}
label{font-weight:700;font-size:.92rem;display:flex;flex-direction:column;gap:6px}label b{color:var(--warn)}
input[type=text],select{font:inherit;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input[type=color]{width:100%;height:42px;border:1.5px solid var(--line);border-radius:10px;background:#fff;padding:3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
:focus-visible{outline:3px solid var(--navy2);outline-offset:2px}
.btn{font:inherit;font-weight:700;font-size:1.05rem;border:0;border-radius:999px;padding:13px;cursor:pointer;width:100%;color:#fff;
  background:linear-gradient(135deg,var(--navy),var(--navy2));box-shadow:0 4px 12px rgba(28,31,74,.22)}
.btn:hover{box-shadow:0 6px 16px rgba(28,31,74,.34)}
canvas{display:block;width:100%;height:auto;border-radius:12px;border:1px solid var(--line);background:#fff}
.note{font-size:.85rem;color:var(--muted);margin:0}
.more{background:var(--chip);border-radius:12px;padding:14px 16px;font-size:.92rem}
.more a{font-weight:700;color:var(--navy)}
</style></head><body>
<header><div class="bar">
  <a class="logo" href="/"><svg viewBox="0 0 32 24" width="28" height="21" aria-hidden="true"><path fill="currentColor" d="M2 6l7 6 7-10 7 10 7-6-3 16H5z"/><rect x="5" y="21" width="22" height="3" rx="1" fill="currentColor"/></svg>KINGDOM</a>
  <nav><a href="/">쇼핑</a><a href="/#car">뉴스</a><a href="/ai" aria-current="page">AI 프로그램</a></nav>
</div></header>
<main>
  <div class="title"><h1>🖼️ 블로그 썸네일 만들기 <span class="free">로그인 필요 없음</span></h1>
    <p>제목만 넣으면 블로그·스레드·쇼츠 썸네일이 바로 만들어져요. 다 되면 이미지로 저장하세요.</p></div>
  <div class="step">
    <section class="panel" aria-label="썸네일 설정">
      <label for="t1">큰 제목 <b>*</b><input type="text" id="t1" value="겨울철 손 건조"></label>
      <label for="t2">작은 글<input type="text" id="t2" value="핸드크림보다 중요한 3가지"></label>
      <div class="two">
        <label for="bg">배경색<input type="color" id="bg" value="#1c1f4a"></label>
        <label for="fg">글자색<input type="color" id="fg" value="#ffffff"></label>
      </div>
      <div class="swatches" aria-label="추천 배경색">
        <button class="sw" type="button" style="background:#1c1f4a" data-bg="#1c1f4a" data-fg="#ffffff" aria-label="남색"></button>
        <button class="sw" type="button" style="background:#0f7a5a" data-bg="#0f7a5a" data-fg="#ffffff" aria-label="초록"></button>
        <button class="sw" type="button" style="background:#c0263d" data-bg="#c0263d" data-fg="#ffffff" aria-label="빨강"></button>
        <button class="sw" type="button" style="background:#6b4fd8" data-bg="#6b4fd8" data-fg="#ffffff" aria-label="보라"></button>
        <button class="sw" type="button" style="background:#f4f1ea" data-bg="#f4f1ea" data-fg="#17182b" aria-label="밝은 베이지"></button>
        <button class="sw" type="button" style="background:#17182b" data-bg="#17182b" data-fg="#ffffff" aria-label="검정"></button>
      </div>
      <label for="size">크기<select id="size"><option value="1200x675">블로그 16:9 (1200×675)</option><option value="1080x1080">정사각형 · 스레드 (1080×1080)</option><option value="1080x1920">쇼츠 (1080×1920)</option></select></label>
      <label for="mark">아래 표시<input type="text" id="mark" value="KINGDOM"></label>
      <button class="btn" id="save" type="button">⬇️ 이미지로 저장</button>
      <p class="note" id="hint">저장이 안 되면 미리보기를 오른쪽 클릭(휴대폰은 길게 누르기) → 이미지 저장.</p>
    </section>
    <section class="panel" aria-label="미리보기">
      <canvas id="cv" width="1200" height="675" aria-label="썸네일 미리보기"></canvas>
      <div class="more">썸네일에 넣을 그림이 필요하면 <a href="https://claude.ai/artifact/6Bc7Db265UTAbCfgcEX7Sv" target="_blank" rel="noopener">이미지 프롬프트 생성기 →</a> (클로드 로그인 필요)</div>
    </section>
  </div>
</main>
<script>
(function(){
const $=s=>document.querySelector(s);
const cv=$("#cv"),cx=cv.getContext("2d");
const BIG='"Black Han Sans","Noto Sans KR",sans-serif';
function wrap(text,maxW){let lines=[],cur="";for(const ch of [...text]){const t=cur+ch;if(cx.measureText(t).width>maxW&&cur){lines.push(cur);cur=ch.trim()?ch:""}else cur=t}if(cur)lines.push(cur);return lines}
function draw(){
  const [w,h]=$("#size").value.split("x").map(Number);cv.width=w;cv.height=h;
  const bg=$("#bg").value,fg=$("#fg").value;
  cx.fillStyle=bg;cx.fillRect(0,0,w,h);
  cx.globalAlpha=.12;cx.fillStyle=fg;
  cx.beginPath();cx.arc(w*.88,h*.18,Math.min(w,h)*.32,0,Math.PI*2);cx.fill();
  cx.beginPath();cx.arc(w*.1,h*.92,Math.min(w,h)*.22,0,Math.PI*2);cx.fill();cx.globalAlpha=1;
  const pad=w*.08,maxW=w-pad*2,t1=$("#t1").value||"제목";
  let big=Math.round(Math.min(w,h)*(w>h?.16:.12));
  cx.font=`${big}px ${BIG}`;let l1=wrap(t1,maxW);
  while(l1.length>3&&big>30){big-=6;cx.font=`${big}px ${BIG}`;l1=wrap(t1,maxW)}
  const small=Math.round(big*.42);
  cx.font=`700 ${small}px "Noto Sans KR",sans-serif`;const l2=$("#t2").value?wrap($("#t2").value,maxW):[];
  const total=l1.length*big*1.15+(l2.length?small*.8+l2.length*small*1.35:0);let y=(h-total)/2+big*.85;
  cx.fillStyle=fg;cx.textAlign="left";cx.font=`${big}px ${BIG}`;
  for(const l of l1){cx.fillText(l,pad,y);y+=big*1.15}
  if(l2.length){y+=small*.3;cx.fillRect(pad,y-small*.9,Math.min(maxW*.18,120),Math.max(4,small*.12));y+=small*.6;
    cx.font=`700 ${small}px "Noto Sans KR",sans-serif`;for(const l of l2){cx.fillText(l,pad,y);y+=small*1.35}}
  if($("#mark").value){cx.globalAlpha=.8;cx.font=`700 ${Math.round(small*.7)}px "Noto Sans KR",sans-serif`;cx.textAlign="right";cx.fillText($("#mark").value,w-pad,h-pad*.6);cx.globalAlpha=1}
}
["t1","t2","bg","fg","size","mark"].forEach(id=>$("#"+id).addEventListener("input",draw));
document.querySelectorAll(".sw").forEach(b=>b.onclick=()=>{$("#bg").value=b.dataset.bg;$("#fg").value=b.dataset.fg;draw()});
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(draw);draw();
$("#save").onclick=()=>cv.toBlob(blob=>{
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="kingdom-thumbnail-"+($("#t1").value||"image").replace(/[\\/:*?"<>|\s]+/g,"-").slice(0,30)+".png";
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  $("#hint").textContent="저장했어요. 다운로드 폴더를 확인하세요.";
},"image/png");
})();
</script>
</body></html>
